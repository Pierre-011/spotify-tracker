<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Éditeur artistes Spotify</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="editor-shell">
    <header class="topbar">
      <div>
        <div class="brand">Éditeur artistes</div>
        <div class="muted">Mise à jour directe de artistes.json dans GitHub</div>
      </div>
      <div class="top-actions">
        <a class="secondary-btn" href="index.html">Retour dashboard</a>
        <button id="saveBtn" class="primary-btn">Enregistrer sur GitHub</button>
      </div>
    </header>

    <div class="editor-layout">
      <aside class="panel">
        <input id="editorSearch" class="input" placeholder="Rechercher par nom ou ID" />
        <div id="artistIndex" class="index-list"></div>
      </aside>

      <section class="panel editor-main">
        <div class="section-head">
          <h2 id="editorTitle">Sélectionne un artiste</h2>
          <span id="dirtyFlag" class="badge">Aucune modification</span>
        </div>

        <div class="editor-actions">
          <a id="spotifyLink" href="#" target="_blank" rel="noopener noreferrer" class="secondary-btn" style="display:none;">
            Ouvrir Spotify
          </a>
        </div>

        <form id="artistForm" class="form-grid">
          <label>ID<input name="id" class="input" disabled /></label>
          <label>Nom<input name="name" class="input" /></label>
          <label>URL Spotify<input name="url" class="input" /></label>
          <label>Followers<input name="followers" class="input" type="number" /></label>
          <label>Auditeurs mensuels<input name="monthly_listeners" class="input" type="number" /></label>
          <label>Popularité<input name="popularity" class="input" type="number" /></label>
          <label>Genres<input name="genres" class="input" placeholder="rock, pop" /></label>
          <label>Last seen<input name="last_seen" class="input" /></label>
        </form>

        <label>Images JSON<textarea name="images" id="imagesField" class="textarea"></textarea></label>

        <div class="editor-footer">
          <button id="resetBtn" type="button" class="secondary-btn">Réinitialiser</button>
          <button id="saveBtnBottom" type="button" class="primary-btn">Enregistrer sur GitHub</button>
        </div>

        <pre id="editorStatus" class="pre-box"></pre>
      </section>
    </div>
  </div>
  <script src="editor.js"></script>
</body>
</html>
